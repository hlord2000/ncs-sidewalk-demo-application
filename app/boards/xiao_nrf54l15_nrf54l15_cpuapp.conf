CONFIG_POWEROFF=y
CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y

CONFIG_GPIO_HOGS=y

CONFIG_SIDEWALK_SUBGHZ_RADIO_SX126X=y
CONFIG_STATE_NOTIFIER=n

CONFIG_ZMS_LOOKUP_CACHE=y
# Each cache entry is a uint64_t (8 B), per zephyr/subsys/fs/zms/Kconfig.
# 512 entries = 4096 B, the upstream default is 128 (1024 B). Halving to
# 256 entries saves 2048 B and still gives 2x the shipped default; a miss
# only costs an extra ZMS linear scan (slower settings lookup), never a
# correctness issue.
CONFIG_ZMS_LOOKUP_CACHE_SIZE=256
CONFIG_ZMS_LOOKUP_CACHE_FOR_SETTINGS=y
