CONFIG_SID_END_DEVICE_DUT=y

CONFIG_SID_END_DEVICE_CLI=y
# On-device certification is unused: provisioning writes credentials from the
# web app via the prov commands and sid_pal_mfg_store_write(). Leaving it off
# frees about 9.8 KB of SRAM (kheap_cert_heap, cert_chain_buffer). The mfg
# store write path stays enabled via SID_END_DEVICE_CLI selecting
# SIDEWALK_MFG_STORAGE_DIAGNOSTIC.
CONFIG_SIDEWALK_ON_DEV_CERT=n

CONFIG_SID_END_DEVICE_AUTO_START=n
CONFIG_SID_END_DEVICE_ECHO_MSGS=n

CONFIG_SIDEWALK_FILE_TRANSFER=y
CONFIG_SIDEWALK_FILE_TRANSFER_SHELL=y
CONFIG_SIDEWALK_LOCATION_SHELL=y
