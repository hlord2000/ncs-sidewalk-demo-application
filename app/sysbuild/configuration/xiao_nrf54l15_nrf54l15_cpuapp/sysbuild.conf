SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y

# Keep the sample in the standard overwrite-only MCUboot flow.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

# Enable LZMA2 (with ARM thumb filter) compressed update images. This shrinks the
# secondary slot image so mcuboot_secondary can be smaller than mcuboot_primary,
# which frees flash for the primary (application) slot. Requires
# SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY (set above); MCUboot gains the LZMA2
# decompressor and grows, see app/sysbuild/mcuboot/prj.conf for the size follow-up.
SB_CONFIG_MCUBOOT_COMPRESSED_IMAGE_SUPPORT=y
