CONFIG_SID_END_DEVICE_MEMFAULT=y

# Chunk draining reuses the sensor monitoring app's TX thread, so pick that
# app variant (this overrides overlay-dut.conf's CONFIG_SID_END_DEVICE_DUT,
# since both are members of the same choice and this file is merged last).
CONFIG_SID_END_DEVICE_SENSOR_MONITORING=y

# Seed the Memfault device id from the Sidewalk SMSN at boot instead of using
# a static/IMEI/MAC id. Also a choice member, set explicitly for the same
# reason as above.
CONFIG_MEMFAULT_NCS_DEVICE_ID_RUNTIME=y

# Reboot reason tracking reads the reset cause through HWINFO.
CONFIG_HWINFO=y

# The BUILD_ASSERT()s in nrf/modules/memfault-firmware-sdk/memfault_integration.c
# require these to be non-empty; there is no board specific default for either.
CONFIG_MEMFAULT_NCS_FW_TYPE="sidewalk-demo"
CONFIG_MEMFAULT_NCS_HW_VERSION="xiao_nrf54l15_cpuapp"

# No IP stack on this device: the backend holds the Memfault project key and
# does the HTTP POST, so CONFIG_MEMFAULT_HTTP_ENABLE must stay off and no
# project key is needed here.

# Memfault event storage holds heartbeats, reboots and traces until a drain
# sends them. The 1024 byte default overflows on a device that cannot reach a
# gateway for a few minutes, which is exactly when the data matters:
#   <err> mflt: Event storage full
# 2048 buys roughly twice the offline window for 1 KB of SRAM. Raise it further
# if devices are expected to stay offline for long stretches, and watch RAM:
# the Memfault build already sits near 93 percent of the 188 KB region.
CONFIG_MEMFAULT_EVENT_STORAGE_SIZE=2048

# base64_encode() for "mflt export", which prints a chunk as text so a host can
# collect it over BLE and post it with the memfault CLI.
CONFIG_BASE64=y

# Use all three Sidewalk links, managed by the stack.
#
# CONFIG_SID_END_DEVICE_MULTI_LINK starts Sidewalk with a BLE|FSK|LoRa link mask
# and hands link selection to the multi-link manager, so the links come up
# alongside each other. Sub-GHz association is slow, so each link gets minutes
# rather than the 30 s the Bluetooth LE only path allows.
#
# The alternative, CONFIG_SID_END_DEVICE_SENSOR_LINK_AUTOSWITCH, is left off. It
# calls sid_deinit()/sid_init() for every change, so its FSK phase drops
# Bluetooth LE entirely: measured on a XIAO nRF54L15, that lost BLE and time
# sync and stopped telemetry and the Memfault drain until the cycle came back.
# Multi-link tears nothing down, so a slow FSK or LoRa association costs
# nothing. Use "sid flow set fsk" / "sid flow set ble" from the shell to force a
# single link by hand.
CONFIG_SID_END_DEVICE_MULTI_LINK=y
CONFIG_SID_END_DEVICE_MULTI_LINK_POLICY=0
CONFIG_SID_END_DEVICE_MULTI_LINK_CONNECT_TIMEOUT_S=300
CONFIG_SID_END_DEVICE_SENSOR_LINK_AUTOSWITCH=n
